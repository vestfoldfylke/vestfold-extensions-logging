name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-nuget-package:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || 
      (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC (trusted publisher setup)
      contents: read

    steps:
      - name: Publish NuGet package
        uses: vestfoldfylke/shared/.github/actions/nuget-publish@f6542527920be9580c41732a3b4c9718b2f69415 # v1.3.2
        with:
          nuget_user: ${{ secrets.NUGET_USER }}
          dotnet_version: "10.0.x"
          project_release_path: "Vestfold.Extensions.Logging/bin/Release"
